name: Validate client and local server

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM regression (without PostgreSQL integration fixtures)
        run: >-
          .\gradlew.bat :humming-contract:jvmTest :humming-core:jvmTest
          :humming-actions:jvmTest :humming-studio-model:jvmTest
          :humming-network:jvmTest :humming-navigation:jvmTest
          :humming-server-application:jvmTest :humming-server-host:jvmTest
          :humming-server-postgres:jvmTest :humming-studio-ui:jvmTest
          :sample:composeApp:jvmTest :HummingUI-Builder:compileKotlinJvm --console=plain
      - name: Shared metadata and browser compilation
        run: >-
          .\gradlew.bat :humming-studio-model:compileCommonMainKotlinMetadata
          :humming-studio-model:compileKotlinWasmJs
          :sample:composeApp:compileKotlinWasmJs
          :HummingUI-Builder:compileKotlinWasmJs --console=plain
